<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>项目协作台</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#182230;background:#f4f6fb;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#182230;--muted:#788396;--line:#e5e9f0;--blue:#4359d8;--blue-soft:#edf0ff;--green:#138a62;--green-soft:#e8f7f0;--panel:#fff;--surface:#f8f9fc;--shadow:0 12px 36px #1b2a4810}*{box-sizing:border-box}body{margin:0;min-width:320px}.topbar{min-height:86px;padding:16px clamp(18px,4vw,60px);display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line)}.brand{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--blue);color:#fff;font-weight:800;font-size:20px}.brand-copy{flex:1}.eyebrow{color:#8791a3;font-size:10px;font-weight:800;letter-spacing:.13em}.brand-copy h1{margin:2px 0 0;font-size:18px;letter-spacing:-.02em}.repo-name{margin-left:8px;color:#9099a9;font-size:13px;font-weight:500}.top-actions{display:flex;align-items:center;gap:10px}.sync-label{color:var(--muted);font-size:12px}.button{min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;transition:.15s}.button:hover{border-color:#c5ccef;background:#fafaff}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button.primary:hover{background:#354ac4}.page{width:min(1440px,100%);margin:0 auto;padding:16px clamp(18px,4vw,60px) 20px}.columns{display:grid;grid-template-columns:minmax(270px,.82fr) minmax(0,1.45fr);gap:20px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.progress-content{padding:20px}.progress-top{display:flex;align-items:end;justify-content:space-between;gap:12px}.progress-number{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.06em}.progress-caption{margin-top:5px;color:var(--muted);font-size:12px}.progress-count{color:var(--muted);font-size:12px;text-align:right}.bar{height:8px;margin:18px 0 16px;overflow:hidden;border-radius:99px;background:#edf0f5}.bar span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6679f3,#4359d8);transition:width .25s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.stat strong{display:block;font-size:22px;line-height:1.1}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.stat.done strong{color:var(--green)}.subhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;font-size:13px;font-weight:800}.subhead a{color:var(--blue);font-size:12px;text-decoration:none}.recent-list,.issue-list{display:grid;gap:9px}.recent-item{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f6}.recent-item:last-child{border-bottom:0}.dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:#e5a339}.dot.closed{background:#16a477}.recent-title{color:var(--ink);font-size:12px;line-height:1.55;text-decoration:none}.recent-title:hover,.issue-title:hover{color:var(--blue)}.recent-meta{margin-top:3px;color:var(--muted);font-size:11px}.board{padding:18px 20px 20px}.compose{padding:15px;border:1px solid #dfe4ff;border-radius:12px;background:linear-gradient(140deg,#f8f9ff,#fff)}.compose-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.compose-title{font-size:14px;font-weight:800}.public-tag{padding:4px 8px;border-radius:99px;background:#f0f1f5;color:#677184;font-size:10px;font-weight:800}.field{display:block;margin-top:10px}.field span{display:block;margin-bottom:6px;color:#626e80;font-size:11px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #dfe4ec;border-radius:8px;outline:0;background:#fff;color:var(--ink);font:inherit;font-size:13px}.field input{height:39px;padding:0 11px}.field textarea{min-height:82px;padding:10px 11px;resize:vertical;line-height:1.55}.field input:focus,.field textarea:focus{border-color:#8995ed;box-shadow:0 0 0 3px #4359d81a}.attachments{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.attachment{position:relative;width:78px;height:58px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.attachment img{width:100%;height:100%;object-fit:cover}.attach-note{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.compose-bottom .button{flex:none}.form-note{min-height:16px;color:#bd4f45;font-size:11px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.list-head h3{margin:0;font-size:15px}.filters{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#f7f8fb}.filter{padding:6px 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}.filter.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #1b2a4814}.issue-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;transition:border-color .15s,transform .15s}.issue-card:hover{border-color:#cbd1fa;transform:translateY(-1px)}.issue-main{min-width:0}.issue-title{display:block;color:var(--ink);font-size:13px;font-weight:700;line-height:1.5;text-decoration:none;overflow-wrap:anywhere}.issue-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:10px}.state{padding:3px 7px;border-radius:99px;background:#fff4df;color:#9b650c;font-weight:800}.state.closed{background:var(--green-soft);color:var(--green)}.label{padding:3px 7px;border-radius:99px;background:var(--blue-soft);color:#4c5dc0}.issue-number{flex:none;color:#9aa2b0;font-size:11px;font-weight:700}.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}.error{margin-bottom:12px;padding:10px 12px;border:1px solid #f0d0ca;border-radius:9px;background:#fff7f5;color:#a4493e;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.columns{grid-template-columns:1fr}.progress-content{padding:18px}.topbar{padding-inline:18px}}@media(max-width:560px){.topbar{min-height:72px;gap:10px}.brand{width:36px;height:36px}.brand-copy h1{font-size:15px}.repo-name{display:block;margin:1px 0 0;font-size:11px}.top-actions{gap:6px}.sync-label{display:none}.button{padding-inline:10px;font-size:12px}.page{padding-top:21px}.intro h2{font-size:21px}.board{padding:15px}.list-head{align-items:flex-start;flex-direction:column}.compose-bottom{align-items:flex-start;flex-direction:column}.compose-bottom .button{width:100%}}
  </style>
  <style>
    .view-nav{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
    .nav-button{min-height:34px;padding:0 15px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .nav-button[aria-pressed="true"]{background:#fff;color:var(--blue);box-shadow:0 1px 4px #18223012}
    .columns{display:block}
    .panel[hidden]{display:none}
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .list-head h3{margin:0}
    .list-actions{display:flex;align-items:center;gap:10px}
    .list-actions .filters{display:flex;gap:5px}
    .compose-dialog{width:min(640px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;padding:0;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #17213a38}
    .compose-dialog::backdrop{background:#10182870}
    .honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    .compose-dialog .compose{padding:22px}
    .dialog-actions{display:flex;align-items:center;gap:8px}
    .dialog-close{width:30px;height:30px;border:0;border-radius:8px;background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
    @media(max-width:850px){.topbar{flex-wrap:wrap}.view-nav{order:3;flex-basis:100%;justify-content:center}.top-actions{margin-left:auto}}
    @media(max-width:560px){.topbar{padding:12px 16px}.top-actions{width:100%;justify-content:space-between}.page{padding:12px 16px 16px}.list-head{align-items:flex-start;flex-wrap:wrap}.list-actions{width:100%;justify-content:space-between;flex-wrap:wrap}.compose-dialog .compose{padding:17px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-hidden="true">D</div>
    <div class="brand-copy"><div class="eyebrow">PROJECT SPACE</div><h1>项目协作台 <span class="repo-name">chengfengsunce / dashboard</span></h1></div>
    <nav class="view-nav" aria-label="页面导航">
      <button class="nav-button" type="button" aria-pressed="true" data-view-target="requirements">需求</button>
      <button class="nav-button" type="button" aria-pressed="false" data-view-target="progress">进度</button>
    </nav>
    <div class="top-actions"><span class="sync-label" id="sync-label">读取项目进度…</span><button class="button" id="refresh" type="button">刷新</button><a class="button" href="https://github.com/chengfengsunce/dashboard" target="_blank" rel="noreferrer">打开仓库 ↗</a></div>
  </header>
  <main class="page">
    <div id="load-error" class="error" hidden></div>
    <div class="columns">
      <section class="panel" id="progress-panel" data-view-panel="progress" aria-label="项目进度" hidden>
        <div class="progress-content">
          <div class="progress-top"><div><div class="progress-number" id="progress-percent">0%</div><div class="progress-caption">需求完成率</div></div><div class="progress-count"><strong id="progress-done">0</strong> / <span id="progress-total">0</span> 项已完成</div></div>
          <div class="bar" role="progressbar" aria-label="需求完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>
          <div class="stats"><div class="stat"><strong id="open-count">0</strong><span>进行中</span></div><div class="stat done"><strong id="closed-count">0</strong><span>已完成</span></div></div>
          <div class="subhead"><span>最近进展</span><a href="https://github.com/chengfengsunce/dashboard/issues" target="_blank" rel="noreferrer">查看全部 ↗</a></div>
          <div id="recent-list" class="recent-list"><div class="empty">正在读取…</div></div>
        </div>
      </section>
      <section class="panel" id="requirements-panel" data-view-panel="requirements" aria-labelledby="requirements-heading">
        <div class="board">
          <div class="list-head"><h3 id="requirements-heading">需求列表</h3><div class="list-actions"><div class="filters" role="group" aria-label="筛选需求"><button class="filter active" type="button" data-filter="open">进行中</button><button class="filter" type="button" data-filter="closed">已完成</button><button class="filter" type="button" data-filter="all">全部</button></div><button class="button primary" id="open-requirement-dialog" type="button">＋ 新增需求</button></div></div>
          <div id="issue-list" class="issue-list"><div class="empty">正在读取需求…</div></div>
          <dialog id="requirement-dialog" class="compose-dialog" aria-labelledby="dialog-title">
            <form id="requirement-form" class="compose">
              <div class="compose-top"><span id="dialog-title" class="compose-title">新增需求</span><div class="dialog-actions"><span class="public-tag">公开</span><button class="dialog-close" id="close-requirement-dialog" type="button" aria-label="关闭弹窗">×</button></div></div>
              <label class="field"><span>需求标题</span><input id="issue-title" name="title" maxlength="180" required placeholder="一句话说清楚想做什么"></label>
              <label class="field"><span>补充说明</span><textarea id="issue-body" name="body" placeholder="写一下现在的问题、希望怎么改"></textarea></label>
              <div id="attachments" class="attachments" aria-label="粘贴图片预览"></div>
              <label class="honeypot" aria-hidden="true">公司网站<input name="company_website" type="text" tabindex="-1" autocomplete="off"></label>
              <p class="attach-note">截图粘贴后会自动附到公开需求中。</p>
              <div class="compose-bottom"><span id="form-note" class="form-note" role="status"></span><button class="button primary" type="submit">提交需求</button></div>
            </form>
          </dialog>
        </div>
      </section>
    </div>
  </main>
  <script>
    const repository = 'chengfengsunce/dashboard';
    const issueList = document.getElementById('issue-list');
    const recentList = document.getElementById('recent-list');
    const requirementsDialog = document.getElementById('requirement-dialog');
    const issueApiBaseUrl = 'https://dashboard-issue-api.ACCOUNT_SUBDOMAIN.workers.dev';
    const attachmentFiles = [];
    let issues = [];
    let filter = 'open';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    }

    function formatDate(value) {
      if (!value) return '时间未知';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleDateString('zh-CN', {year:'numeric', month:'short', day:'numeric'});
    }

    function issueNumber(issue) {
      return issue.number ?? (String(issue.id || '').split(':').pop() || '');
    }

    function issueUrl(issue) {
      return `https://github.com/${repository}/issues/${encodeURIComponent(issueNumber(issue))}`;
    }

    function renderIssue(issue) {
      const closed = issue.state === 'closed';
      const labels = (issue.labels || []).map(label => `<span class="label">${escapeHtml(typeof label === 'string' ? label : label.name)}</span>`).join('');
      return `<article class="issue-card"><div class="issue-main"><a class="issue-title" href="${issueUrl(issue)}" target="_blank" rel="noreferrer">${escapeHtml(issue.title || '未命名需求')}</a><div class="issue-meta"><span class="state ${closed ? 'closed' : ''}">${closed ? '已完成' : '进行中'}</span><span>更新于 ${formatDate(issue.updated_at)}</span>${labels}</div></div><span class="issue-number">#${escapeHtml(issueNumber(issue))}</span></article>`;
    }

    function render() {
      const openIssues = issues.filter(issue => issue.state !== 'closed');
      const closedIssues = issues.filter(issue => issue.state === 'closed');
      const donePercent = issues.length ? Math.round(closedIssues.length / issues.length * 100) : 0;
      document.getElementById('progress-percent').textContent = `${donePercent}%`;
      document.getElementById('progress-done').textContent = closedIssues.length;
      document.getElementById('progress-total').textContent = issues.length;
      document.getElementById('open-count').textContent = openIssues.length;
      document.getElementById('closed-count').textContent = closedIssues.length;
      document.getElementById('progress-bar').style.width = `${donePercent}%`;
      document.querySelector('.bar').setAttribute('aria-valuenow', String(donePercent));

      const recent = [...issues].sort((a, b) => Date.parse(b.updated_at || 0) - Date.parse(a.updated_at || 0)).slice(0, 5);
      recentList.innerHTML = recent.length ? recent.map(issue => `<div class="recent-item"><span class="dot ${issue.state === 'closed' ? 'closed' : ''}"></span><div><a class="recent-title" href="${issueUrl(issue)}" target="_blank" rel="noreferrer">${escapeHtml(issue.title || '未命名需求')}</a><div class="recent-meta">${issue.state === 'closed' ? '已完成' : '进行中'} · ${formatDate(issue.updated_at)}</div></div></div>`).join('') : '<div class="empty">还没有需求，右侧可以直接添加。</div>';

      const visible = filter === 'all' ? issues : issues.filter(issue => issue.state === filter);
      issueList.innerHTML = visible.length ? visible.map(renderIssue).join('') : `<div class="empty">${filter === 'closed' ? '还没有已完成的需求。' : '没有进行中的需求。'}</div>`;
    }

    async function loadData() {
      const refresh = document.getElementById('refresh');
      const status = document.getElementById('sync-label');
      const error = document.getElementById('load-error');
      refresh.disabled = true;
      status.textContent = '正在刷新…';
      error.hidden = true;
      try {
        const response = await fetch(`./data.json?refresh=${Date.now()}`, {cache:'no-store'});
        if (!response.ok) throw new Error('项目数据暂时无法读取');
        const data = await response.json();
        issues = (data.items || []).filter(item => item.kind === 'issue' && item.repo_full_name === repository);
        issues.sort((a, b) => Date.parse(b.updated_at || 0) - Date.parse(a.updated_at || 0));
        const syncedAt = data.generated_at ? new Date(data.generated_at).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
        status.textContent = syncedAt ? `数据更新于 ${syncedAt}` : '数据已更新';
        render();
      } catch (failure) {
        status.textContent = '暂时无法刷新';
        error.hidden = false;
        error.textContent = `${failure.message}；可以直接打开 GitHub 查看或提交需求。`;
        recentList.innerHTML = '<div class="empty">项目进度暂时不可用。</div>';
        issueList.innerHTML = '<div class="empty">需求暂时不可用。</div>';
      } finally {
        refresh.disabled = false;
      }
    }

    async function refreshIssuesFromGitHub() {
      try {
        const response = await fetch(`https://api.github.com/repos/${repository}/issues?state=all&per_page=100`, {headers:{Accept:'application/vnd.github+json'}, cache:'no-store'});
        if (!response.ok) throw new Error('GitHub 暂时无法读取');
        const data = await response.json();
        issues = data.filter(issue => !issue.pull_request);
        issues.sort((a, b) => Date.parse(b.updated_at || 0) - Date.parse(a.updated_at || 0));
        document.getElementById('sync-label').textContent = '需求列表已更新';
        render();
      } catch {
        await loadData();
      }
    }

    document.querySelectorAll('[data-view-target]').forEach(button => button.addEventListener('click', () => {
      const view = button.dataset.viewTarget;
      document.querySelectorAll('[data-view-target]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelectorAll('[data-view-panel]').forEach(panel => panel.hidden = panel.dataset.viewPanel !== view);
    }));

    document.getElementById('open-requirement-dialog').addEventListener('click', () => {
      document.getElementById('form-note').textContent = '';
      requirementsDialog.showModal();
    });
    document.getElementById('close-requirement-dialog').addEventListener('click', () => requirementsDialog.close());
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(item => item.classList.toggle('active', item === button));
      render();
    }));

    document.getElementById('refresh').addEventListener('click', loadData);

    document.getElementById('issue-body').addEventListener('paste', event => {
      const images = Array.from(event.clipboardData?.items || []).filter(item => item.type.startsWith('image/')).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      event.preventDefault();
      if (attachmentFiles.length + images.length > 4) {
        document.getElementById('form-note').textContent = '最多粘贴 4 张图片。';
        return;
      }
      images.forEach(file => attachmentFiles.push({file, url:URL.createObjectURL(file)}));
      document.getElementById('attachments').innerHTML = attachmentFiles.map((attachment, index) => `<div class="attachment"><img src="${attachment.url}" alt="粘贴的截图 ${index + 1}"></div>`).join('');
      document.getElementById('form-note').textContent = `已添加 ${attachmentFiles.length} 张图片。`;
    });

    document.getElementById('requirement-form').addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.getElementById('issue-title').value.trim();
      const description = document.getElementById('issue-body').value.trim();
      if (!title) {
        document.getElementById('form-note').textContent = '先写一个需求标题。';
        return;
      }
      const formNote = document.getElementById('form-note');
      const submitButton = event.currentTarget.querySelector('[type="submit"]');
      if (issueApiBaseUrl.includes('ACCOUNT_SUBDOMAIN')) {
        formNote.textContent = '自动提交通道还未部署，请稍后再试。';
        return;
      }
      const payload = new FormData();
      payload.set('title', title);
      payload.set('body', description);
      payload.set('company_website', event.currentTarget.elements.company_website.value);
      attachmentFiles.forEach(({file}) => payload.append('image', file, file.name));
      submitButton.disabled = true;
      formNote.textContent = '正在提交…';
      try {
        const response = await fetch(new URL('/api/issues', issueApiBaseUrl), {method:'POST', body:payload});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '提交失败，请稍后重试。');
        requirementsDialog.close();
        event.currentTarget.reset();
        attachmentFiles.splice(0).forEach(({url}) => URL.revokeObjectURL(url));
        document.getElementById('attachments').replaceChildren();
        document.getElementById('sync-label').textContent = `需求 #${result.number} 已提交`;
        await refreshIssuesFromGitHub();
      } catch (error) {
        formNote.textContent = error.message || '提交失败，请稍后重试。';
      } finally {
        submitButton.disabled = false;
      }
    });

    loadData();
  </script>
</body>
</html>
