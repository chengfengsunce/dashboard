<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>项目协作台</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#182230;background:#f4f6fb;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#182230;--muted:#788396;--line:#e5e9f0;--blue:#4359d8;--blue-soft:#edf0ff;--green:#138a62;--green-soft:#e8f7f0;--panel:#fff;--surface:#f8f9fc;--shadow:0 12px 36px #1b2a4810}*{box-sizing:border-box}body{margin:0;min-width:320px}.topbar{min-height:86px;padding:16px clamp(18px,4vw,60px);display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line)}.brand{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--blue);color:#fff;font-weight:800;font-size:20px}.brand-copy{flex:1}.eyebrow{color:#8791a3;font-size:10px;font-weight:800;letter-spacing:.13em}.brand-copy h1{margin:2px 0 0;font-size:18px;letter-spacing:-.02em}.repo-name{margin-left:8px;color:#9099a9;font-size:13px;font-weight:500}.top-actions{display:flex;align-items:center;gap:10px}.sync-label{color:var(--muted);font-size:12px}.button{min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;transition:.15s}.button:hover{border-color:#c5ccef;background:#fafaff}.button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.button.primary:hover{background:#354ac4}.page{width:min(1440px,100%);margin:0 auto;padding:16px clamp(18px,4vw,60px) 20px}.columns{display:grid;grid-template-columns:minmax(270px,.82fr) minmax(0,1.45fr);gap:20px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.progress-content{padding:20px}.progress-top{display:flex;align-items:end;justify-content:space-between;gap:12px}.progress-number{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.06em}.progress-caption{margin-top:5px;color:var(--muted);font-size:12px}.progress-count{color:var(--muted);font-size:12px;text-align:right}.bar{height:8px;margin:18px 0 16px;overflow:hidden;border-radius:99px;background:#edf0f5}.bar span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6679f3,#4359d8);transition:width .25s}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.stat strong{display:block;font-size:22px;line-height:1.1}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.stat.done strong{color:var(--green)}.subhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;font-size:13px;font-weight:800}.subhead a{color:var(--blue);font-size:12px;text-decoration:none}.recent-list,.issue-list{display:grid;gap:9px}.recent-item{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f6}.recent-item:last-child{border-bottom:0}.dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:#e5a339}.dot.closed{background:#16a477}.recent-title{color:var(--ink);font-size:12px;line-height:1.55;text-decoration:none}.recent-title:hover,.issue-title:hover{color:var(--blue)}.recent-meta{margin-top:3px;color:var(--muted);font-size:11px}.board{padding:18px 20px 20px}.compose{padding:15px;border:1px solid #dfe4ff;border-radius:12px;background:linear-gradient(140deg,#f8f9ff,#fff)}.compose-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.compose-title{font-size:14px;font-weight:800}.public-tag{padding:4px 8px;border-radius:99px;background:#f0f1f5;color:#677184;font-size:10px;font-weight:800}.field{display:block;margin-top:10px}.field span{display:block;margin-bottom:6px;color:#626e80;font-size:11px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #dfe4ec;border-radius:8px;outline:0;background:#fff;color:var(--ink);font:inherit;font-size:13px}.field input{height:39px;padding:0 11px}.field textarea{min-height:82px;padding:10px 11px;resize:vertical;line-height:1.55}.field input:focus,.field textarea:focus{border-color:#8995ed;box-shadow:0 0 0 3px #4359d81a}.attachments{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.attachment{position:relative;width:78px;height:58px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.attachment img{width:100%;height:100%;object-fit:cover}.attach-note{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.compose-bottom .button{flex:none}.form-note{min-height:16px;color:#bd4f45;font-size:11px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.list-head h3{margin:0;font-size:15px}.filters{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#f7f8fb}.filter{padding:6px 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}.filter.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #1b2a4814}.issue-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;transition:border-color .15s,transform .15s}.issue-card:hover{border-color:#cbd1fa;transform:translateY(-1px)}.issue-main{min-width:0}.issue-title{display:block;color:var(--ink);font-size:13px;font-weight:700;line-height:1.5;text-decoration:none;overflow-wrap:anywhere}.issue-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:10px}.state{padding:3px 7px;border-radius:99px;background:#fff4df;color:#9b650c;font-weight:800}.state.closed{background:var(--green-soft);color:var(--green)}.label{padding:3px 7px;border-radius:99px;background:var(--blue-soft);color:#4c5dc0}.issue-number{flex:none;color:#9aa2b0;font-size:11px;font-weight:700}.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}.error{margin-bottom:12px;padding:10px 12px;border:1px solid #f0d0ca;border-radius:9px;background:#fff7f5;color:#a4493e;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.columns{grid-template-columns:1fr}.progress-content{padding:18px}.topbar{padding-inline:18px}}@media(max-width:560px){.topbar{min-height:72px;gap:10px}.brand{width:36px;height:36px}.brand-copy h1{font-size:15px}.repo-name{display:block;margin:1px 0 0;font-size:11px}.top-actions{gap:6px}.sync-label{display:none}.button{padding-inline:10px;font-size:12px}.page{padding-top:21px}.intro h2{font-size:21px}.board{padding:15px}.list-head{align-items:flex-start;flex-direction:column}.compose-bottom{align-items:flex-start;flex-direction:column}.compose-bottom .button{width:100%}}
  </style>
  <style>
    .view-nav{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
    .nav-button{min-height:34px;padding:0 15px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .nav-button[aria-pressed="true"]{background:#fff;color:var(--blue);box-shadow:0 1px 4px #18223012}
    .columns{display:block}
    .panel[hidden]{display:none}
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .list-head h3{margin:0}
    .list-actions{display:flex;align-items:center;gap:10px}
    .list-actions .filters{display:flex;gap:5px}
    .compose-dialog{width:min(640px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;padding:0;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #17213a38}
    .compose-dialog::backdrop{background:#10182870}
    .honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    .compose-dialog .compose{padding:22px}
    .project-filter{position:relative;flex:none}
    .project-filter>summary{list-style:none;cursor:pointer}
    .project-filter>summary::-webkit-details-marker{display:none}
    .project-filter-toggle{gap:8px;white-space:nowrap}
    .project-filter-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:min(300px,calc(100vw - 32px));padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 12px 32px #18223020}
    .project-filter-search{width:100%;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
    .project-filter-actions{display:flex;justify-content:space-between;padding:8px 0}
    .project-filter-actions button{padding:3px 0;border:0;background:transparent;color:var(--blue);font:inherit;font-size:12px;cursor:pointer}
    .project-options{display:grid;gap:2px;max-height:250px;overflow:auto}
    .project-option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:7px;font-size:13px;cursor:pointer}
    .project-option:hover{background:var(--surface)}
    .project-option input{accent-color:var(--blue)}
    .dialog-actions{display:flex;align-items:center;gap:8px}
    .dialog-close{width:30px;height:30px;border:0;border-radius:8px;background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
    @media(max-width:850px){.topbar{flex-wrap:wrap}.view-nav{order:3;flex-basis:100%;justify-content:center}.top-actions{margin-left:auto}}
    @media(max-width:560px){.topbar{padding:12px 16px}.top-actions{width:100%;justify-content:space-between}.page{padding:12px 16px 16px}.list-head{align-items:flex-start;flex-wrap:wrap}.list-actions{width:100%;justify-content:space-between;flex-wrap:wrap}.compose-dialog .compose{padding:17px}}
    html,body{height:100%;overflow:hidden}
    body{height:100dvh;display:flex;flex-direction:column}
    .brand,.brand-copy{display:none}
    .topbar{flex:none;min-height:62px;padding:10px clamp(12px,3vw,36px);justify-content:space-between}
    .page{flex:1;min-height:0;width:100%;padding:12px clamp(12px,3vw,36px)}
    .columns,.panel,.board{height:100%;min-height:0}
    .panel{overflow:hidden}
    .board{display:flex;flex-direction:column;padding:14px 18px}
    .board .list-head{flex:none;margin:0 0 12px;flex-direction:row;align-items:center}
    .issue-list{position:relative;display:block;flex:1;min-height:0;overflow:hidden}
    .issue-list>.empty{position:absolute;inset:48px 0 0;display:grid;place-content:center}
    .requirements-table{display:flex;flex-direction:column;width:100%;height:100%;border-collapse:collapse;font-size:13px;text-align:left}
    .requirements-table thead{flex:none;background:var(--surface);color:#667085}
    .requirements-table tbody{display:grid;grid-template-rows:repeat(10,minmax(0,1fr));flex:1;min-height:0}
    .requirements-table tr{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(100px,.3fr) minmax(90px,.22fr) 106px 62px;align-items:center;min-height:0;border-bottom:1px solid var(--line)}
    .requirements-table th,.requirements-table td{display:block;min-width:0;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .requirements-table td{padding-block:0}
    .requirements-table tbody tr:hover{background:#f8f9ff}
    .requirements-table .issue-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500}
    .issue-sequence{color:var(--muted);font-variant-numeric:tabular-nums}
    .complete-issue{padding:4px 0;border:0;background:transparent;color:var(--green);font:inherit;font-size:12px;cursor:pointer}
    .issue-completed{color:var(--green);font-size:12px}
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:none;padding-top:12px}
    .pagination .button{min-height:32px}
    .button:disabled{opacity:.4;cursor:not-allowed}
    .page-info{margin-right:auto;font-size:12px;color:var(--muted)}
    .field select{width:100%;min-height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
    .field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .completion-note{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.7}.choice{display:flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--ink);font-size:13px;font-weight:600}.choice input{width:15px;height:15px;accent-color:var(--blue)}
    #complete-issue-title{display:block;margin-bottom:6px;color:var(--ink);overflow-wrap:anywhere}
    @media(max-width:850px){.topbar{flex-wrap:nowrap}.view-nav{order:0;flex-basis:auto}.top-actions{margin-left:0}.sync-label{display:none}.requirements-table tr{grid-template-columns:40px minmax(0,1fr) 110px 80px 94px 48px}}
    @media(max-width:560px){.topbar{padding:8px 10px;gap:6px}.top-actions{width:auto}.top-actions>a{display:none}.view-nav{padding:2px;gap:0}.nav-button{padding:0 9px}.project-filter-toggle{padding:0 8px;gap:3px}.page{padding:8px}.board{padding:10px 8px}.board .list-head{gap:6px;flex-wrap:wrap;margin-bottom:8px}.list-actions{gap:5px}.requirements-table{font-size:11px}.requirements-table tr{grid-template-columns:30px minmax(0,1fr) 54px 42px 72px 40px}.requirements-table th,.requirements-table td{padding-inline:3px}.requirements-table .issue-title,.complete-issue,.issue-completed{font-size:11px}.pagination{gap:6px;padding-top:8px}.pagination .button{padding:0 8px;font-size:12px}.page-info{font-size:11px}.field-pair{grid-template-columns:1fr;gap:0}}
    @media(max-height:600px){.topbar{min-height:50px;padding-block:6px}.page{padding-block:6px}.board{padding-block:8px}.board .list-head{margin-bottom:6px}.pagination{padding-top:6px}.requirements-table th{padding-block:5px}}
    .requirements-table tr{grid-template-columns:76px minmax(0,1fr) minmax(100px,.3fr) minmax(90px,.22fr) 106px 62px}
    .requirements-table .issue-sequence,.issue-selection{display:flex;align-items:center;gap:8px}
    .issue-selection input,.issue-sequence input{width:15px;height:15px;margin:0;accent-color:var(--blue);flex:none;cursor:pointer}
    .requirements-table tr[data-selected="true"]{background:var(--blue-soft)}
    .batch-actions{display:flex;align-items:center;gap:10px;flex:none;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px}
    .batch-actions[hidden],#single-completion-field[hidden],#batch-completion-fields[hidden]{display:none}
    .batch-actions .button{min-height:32px;font-size:12px}
    .batch-actions .batch-clear{margin-left:auto}
    #selection-note{color:var(--muted);font-size:11px}
    .completion-entry{padding:14px 0;border-top:1px solid var(--line)}
    .completion-entry:first-child{padding-top:0;border-top:0}
    .completion-entry-title{font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    .draft-save-status{min-height:18px;margin:6px 0 14px;color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .draft-save-status button{padding:0;border:0;background:transparent;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer}
    .edit-submitter{display:block;width:100%;min-height:28px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;text-decoration:underline;text-decoration-color:#b7c1d1;text-underline-offset:3px;overflow-wrap:anywhere;cursor:pointer}
    .edit-submitter:hover{color:var(--blue);text-decoration-color:var(--blue)}
    .edit-submitter:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
    [data-reload-submitter][hidden]{display:none}
    #submitter-dialog .compose-bottom{align-items:flex-start}
    #submitter-dialog .form-note{line-height:1.6;overflow-wrap:anywhere}
    #submitter-dialog .dialog-actions{flex:none}
    @media(max-width:560px){.edit-submitter{min-height:40px}#submitter-dialog .compose-bottom{flex-wrap:wrap}#submitter-dialog .dialog-actions{margin-left:auto}}
    .completion-entry-meta,.batch-entry-result{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
    .batch-entry-result:empty{display:none}
    #complete-form .choice{margin-top:16px}
    @media(max-width:850px){.requirements-table tr{grid-template-columns:64px minmax(0,1fr) 110px 80px 94px 48px}}
    @media(max-width:560px){.requirements-table tr{grid-template-columns:48px minmax(0,1fr) 54px 42px 72px 40px}.requirements-table .issue-sequence,.issue-selection{gap:4px}.batch-actions{gap:6px;padding:7px 6px;flex-wrap:wrap}.batch-actions .button{padding-inline:8px;font-size:11px}#selection-note{flex-basis:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-hidden="true">D</div>
    <div class="brand-copy"><div class="eyebrow">PROJECT SPACE</div><h1>项目协作台 <span class="repo-name">chengfengsunce / dashboard</span></h1></div>
    <nav class="view-nav" aria-label="页面导航">
      <button class="nav-button" type="button" aria-pressed="true" data-view-target="requirements">需求</button>
      <button class="nav-button" type="button" aria-pressed="false" data-view-target="progress">进度</button>
    </nav>
    <details class='project-filter' id='project-filter'>
      <summary class='button project-filter-toggle'><span>项目：</span><span id='project-filter-label'>全部项目</span><span aria-hidden='true'>⌄</span></summary>
      <div class='project-filter-menu'>
        <input class='project-filter-search' id='project-search' type='search' placeholder='搜索项目' aria-label='搜索项目'>
        <div class='project-filter-actions'><button id='select-all-projects' type='button'>全选</button><button id='clear-projects' type='button'>清空</button></div>
        <div class='project-options' id='project-options' aria-label='项目列表'></div>
      </div>
    </details>
    <div class="top-actions"><span class="sync-label" id="sync-label">读取项目进度…</span><button class="button" id="refresh" type="button">刷新</button><a class="button" href="https://github.com/chengfengsunce/dashboard" target="_blank" rel="noreferrer">打开仓库 ↗</a></div>
  </header>
  <main class="page">
    <div id="load-error" class="error" hidden></div>
    <div class="columns">
      <section class="panel" id="progress-panel" data-view-panel="progress" aria-label="项目进度" hidden>
        <div class="progress-content">
          <div class="progress-top"><div><div class="progress-number" id="progress-percent">0%</div><div class="progress-caption">需求完成率</div></div><div class="progress-count"><strong id="progress-done">0</strong> / <span id="progress-total">0</span> 项已完成</div></div>
          <div class="bar" role="progressbar" aria-label="需求完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>
          <div class="stats"><div class="stat"><strong id="open-count">0</strong><span>进行中</span></div><div class="stat done"><strong id="closed-count">0</strong><span>已完成</span></div></div>
          <div class="subhead"><span>最近进展</span><a href="https://github.com/chengfengsunce/dashboard/issues" target="_blank" rel="noreferrer">查看全部 ↗</a></div>
          <div id="recent-list" class="recent-list"><div class="empty">正在读取…</div></div>
        </div>
      </section>
      <section class="panel" id="requirements-panel" data-view-panel="requirements" aria-labelledby="requirements-heading">
        <div class="board">
          <div class="list-head"><h3 id="requirements-heading">需求列表</h3><div class="list-actions"><div class="filters" role="group" aria-label="筛选需求"><button class="filter active" type="button" data-filter="open">进行中</button><button class="filter" type="button" data-filter="closed">已完成</button><button class="filter" type="button" data-filter="all">全部</button></div><button class="button primary" id="open-requirement-dialog" type="button">＋ 新增需求</button></div></div>
          <div id="batch-actions" class="batch-actions" hidden><strong id="batch-count" aria-live="polite">已选 0 项</strong><button id="clear-selected-issues" class="button batch-clear" type="button">清空</button><button id="open-batch-completion" class="button primary" type="button">批量完成并通知</button><span id="selection-note" role="status">可跨页选择，每批最多 10 项</span></div>
          <div id="issue-list" class="issue-list"><div class="empty">正在读取需求…</div></div>
          <div class="pagination" aria-label="需求翻页"><span id="page-info" class="page-info" aria-live="polite">第 1 / 1 页 · 共 0 条</span><button id="previous-page" class="button" type="button" disabled>上一页</button><button id="next-page" class="button" type="button" disabled>下一页</button></div>
          <dialog id="requirement-dialog" class="compose-dialog" aria-labelledby="dialog-title">
            <form id="requirement-form" class="compose">
              <div class="compose-top"><span id="dialog-title" class="compose-title">新增需求</span><div class="dialog-actions"><span class="public-tag">公开</span><button class="dialog-close" id="close-requirement-dialog" type="button" aria-label="关闭弹窗">×</button></div></div>
              <label class="field"><span>需求标题</span><input id="issue-title" name="title" maxlength="180" required placeholder="一句话说清楚想做什么"></label>
              <div class="field-pair"><label class="field"><span>所属项目</span><select id="issue-project" name="project" required aria-label="所属项目"></select></label><label class="field"><span>提出人</span><input id="issue-submitter" name="submitter" maxlength="60" required placeholder="填写提出人姓名" autocomplete="name"></label></div>
              <label class="field"><span>补充说明</span><textarea id="issue-body" name="body" placeholder="写一下现在的问题、希望怎么改"></textarea></label>
              <div id="attachments" class="attachments" aria-label="粘贴图片预览"></div>
              <label class="honeypot" aria-hidden="true">公司网站<input name="company_website" type="text" tabindex="-1" autocomplete="off"></label>
              <p class="attach-note">截图粘贴后会自动附到公开需求中。</p>
              <div class="compose-bottom"><span id="form-note" class="form-note" role="status"></span><button class="button primary" type="submit">提交需求</button></div>
            </form>
          </dialog>
          <dialog id="submitter-dialog" class="compose-dialog" aria-labelledby="submitter-dialog-title">
            <form class="compose">
              <div class="compose-top"><span id="submitter-dialog-title" class="compose-title">修改提出人</span><button data-close-submitter class="dialog-close" type="button" aria-label="关闭提出人编辑">×</button></div>
              <p data-submitter-title class="completion-note"></p>
              <label class="field"><span>提出人</span><input id="edit-submitter-value" name="submitter" maxlength="60" required autocomplete="name" placeholder="填写提出人姓名"></label>
              <p class="attach-note">保存后，完成通知会使用这个姓名。</p>
              <div class="compose-bottom"><span class="form-note" role="status"></span><div class="dialog-actions"><button data-reload-submitter class="button" type="button" hidden>重新读取</button><button class="button primary" type="submit">保存</button></div></div>
            </form>
          </dialog>
          <dialog id="complete-dialog" class="compose-dialog" aria-labelledby="complete-dialog-title">
            <form id="complete-form" class="compose">
              <div class="compose-top"><span id="complete-dialog-title" class="compose-title">完成需求</span><button id="close-complete-dialog" class="dialog-close" type="button" aria-label="关闭完成确认">×</button></div>
              <p class="completion-note"><strong id="complete-issue-title"></strong><span id="completion-description">确认后标记为已完成，自动移入“已完成”列表；需求和附件都会保留。</span></p>
              <div id="single-completion-field"><label class="field"><span>改好了什么（选填）</span><textarea id="completion-summary" name="completion_summary" maxlength="500" placeholder="用一两句话说明：以前有什么问题，现在可以怎么用了。"></textarea></label><p id="completion-draft-status" class="draft-save-status" role="status"></p></div>
              <div id="batch-completion-fields" hidden></div>
              <label class="choice"><input id="notify-submitter" type="checkbox" checked><span id="notify-submitter-label">通过钉钉通知提出人</span></label>
              <div class="compose-bottom"><span id="complete-note" class="form-note" role="status"></span><button id="confirm-complete" class="button primary" type="submit">确认完成</button></div>
            </form>
          </dialog>
        </div>
      </section>
    </div>
  </main>
  <script type="module">
    import { createCompletionDraftStore } from './completion-drafts.mjs';
    import { createSubmitterEditor } from './submitter-editor.mjs';
    const repository = 'chengfengsunce/dashboard';
    const issueList = document.getElementById('issue-list');
    const recentList = document.getElementById('recent-list');
    const projectOptions = document.getElementById('project-options');
    const projectSearch = document.getElementById('project-search');
    const requirementsDialog = document.getElementById('requirement-dialog');
    const issueApiBaseUrl = 'https://dashboard-issue-api.17760716857.workers.dev';
    const attachmentFiles = [];
    let items = [];
    let allItems = [];
    let repositories = [];
    let selectedRepositories = new Set();
    let filter = 'open';
    const pageSize = 10;
    let currentPage = 1;
    const selectedIssueKeys = new Set();
    let completionTargets = [];
    let batchCompletion = false;
    let completionBusy = false;
    let completionPendingKeys = new Set();
    const completionResults = new Map();
    let submittedNotificationCount = 0;
    let pendingCompletions = new Map();
    try { pendingCompletions = new Map(JSON.parse(localStorage.getItem('dashboard-completed-issues') || '[]')); } catch {}

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    }

    function formatDate(value) {
      if (!value) return '时间未知';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'});
    }

    function issueNumber(issue) {
      return issue.number ?? (String(issue.id || '').split(':').pop() || '');
    }

    function issueUrl(issue) {
      return issue.html_url || `https://github.com/${issue.repo_full_name || repository}/issues/${encodeURIComponent(issueNumber(issue))}`;
    }

    function issueKey(issue) {
      return `${issue.repo_full_name || repository}#${issueNumber(issue)}`;
    }

    function normalizeIssue(issue) {
      const key = issueKey(issue);
      const sourceUpdatedAt = issue.updated_at;
      const completedAt = pendingCompletions.get(key);
      if (completedAt) {
        const newer = Date.parse(issue.updated_at) > Date.parse(completedAt);
        if (newer || (issue.state === 'closed' && Date.parse(issue.updated_at) >= Date.parse(completedAt))) {
          pendingCompletions.delete(key);
          saveCompletions();
        } else {
          issue = {...issue, state:'closed', updated_at:completedAt};
        }
      }
      let metadata = {};
      const header = (issue.body || '').split('\n', 1)[0].trim();
      if (header.startsWith('<!-- dashboard-meta:') && header.endsWith(' -->')) {
        try { metadata = JSON.parse(header.slice('<!-- dashboard-meta:'.length, -' -->'.length)); } catch {}
      }
      if (!metadata || typeof metadata !== 'object' || Array.isArray(metadata)) metadata = {};
      return submitterEditor.normalize({...issue,
        project_full_name: issue.project_full_name || (typeof metadata.project === 'string' && metadata.project) || issue.repo_full_name || repository,
        submitter: issue.submitter || (typeof metadata.submitter === 'string' && metadata.submitter) || issue.actor || issue.user?.login || '未知',
        completion_summary: issue.completion_summary || (typeof metadata.completion_summary === 'string' ? metadata.completion_summary : ''),
        completion_draft: typeof issue.completion_draft === 'string' ? issue.completion_draft
          : typeof metadata.completion_draft === 'string' ? metadata.completion_draft : undefined,
      }, key, sourceUpdatedAt);
    }

    function saveCompletions() {
      try { localStorage.setItem('dashboard-completed-issues', JSON.stringify([...pendingCompletions])); } catch {}
    }

    let submitterStorage;
    try { submitterStorage = localStorage; } catch {}
    const submitterEditor = createSubmitterEditor({ dialog: document.getElementById('submitter-dialog'), apiBaseUrl: issueApiBaseUrl, storage: submitterStorage,
      onSaved(key, result) {
        allItems = allItems.map(issue => issue.kind === 'issue' && issueKey(issue) === key ? { ...issue, submitter: result.submitter, updated_at: result.updated_at } : issue);
        applyProjectFilter(false);
        render();
        document.getElementById('sync-label').textContent = '提出人已保存';
      },
    });

    function renderIssue(issue, index) {
      const project = (issue.project_full_name || repository).split('/').pop();
      const action = issue.state === 'closed' ? '<span class="issue-completed">已完成</span>' : `<button class="complete-issue" type="button" data-complete-issue="${escapeHtml(issueKey(issue))}" aria-label="完成需求：${escapeHtml(issue.title)}">完成</button>`;
      const key = issueKey(issue);
      const selection = issue.state === 'closed' ? '' : `<input type="checkbox" data-select-issue="${escapeHtml(key)}" aria-label="选择需求：${escapeHtml(issue.title)}" ${selectedIssueKeys.has(key) ? 'checked' : selectedIssueKeys.size >= 10 ? 'disabled' : ''}>`;
      return `<tr data-issue-key="${escapeHtml(key)}" data-selected="${selectedIssueKeys.has(key)}"><td class="issue-sequence">${selection}<span>${(currentPage - 1) * pageSize + index + 1}</span></td><td><a class="issue-title" href="${escapeHtml(issueUrl(issue))}" title="${escapeHtml(issue.title || '未命名需求')}" target="_blank" rel="noreferrer">${escapeHtml(issue.title || '未命名需求')}</a></td><td title="${escapeHtml(issue.project_full_name)}">${escapeHtml(project)}</td><td><button class="edit-submitter" type="button" data-edit-submitter="${escapeHtml(key)}" title="点击修改提出人" aria-label="修改提出人：${escapeHtml(issue.submitter)}">${escapeHtml(issue.submitter)}</button></td><td title="${escapeHtml(issue.created_at || '时间未知')}">${escapeHtml(formatDate(issue.created_at))}</td><td>${action}</td></tr>`;
    }

    function getIssueProjects() {
      const projectByRepo = new Map();
      const projects = new Map();
      for (const item of allItems) {
        if (item.kind !== 'issue') continue;
        const labels = item.labels || [];
        if (labels.some(label => (typeof label === 'string' ? label : label.name) === 'dashboard-hidden')) continue;
        const value = item.project_full_name || item.repo_full_name || repository;
        const repo = item.repo_full_name || repository;
        if (!projectByRepo.has(repo)) projectByRepo.set(repo, new Set());
        projectByRepo.get(repo).add(value);
        const updatedAt = Date.parse(item.created_at || 0) || 0;
        if (!projects.has(value) || updatedAt > projects.get(value).updatedAt) projects.set(value, {name:value.split('/').pop(), updatedAt});
      }
      return {
        projects: [...projects.entries()].map(([value, project]) => ({value, ...project})).sort((a,b) => b.updatedAt - a.updatedAt),
        projectByRepo,
      };
    }

    function updateProjectFilterLabel(projectValues) {
      const label = document.getElementById('project-filter-label');
      label.textContent = !projectValues.length ? '暂无项目' : selectedRepositories.size === projectValues.length ? '全部项目' : selectedRepositories.size ? `已选 ${selectedRepositories.size} 个项目` : '选择项目';
    }

    function renderProjectFilter() {
      const search = projectSearch.value.trim().toLocaleLowerCase();
      const {projects} = getIssueProjects();
      projectOptions.innerHTML = projects.map(project => {
        const matchesSearch = project.value.toLocaleLowerCase().includes(search);
        return `<label class='project-option'${matchesSearch ? '' : ' hidden'}><input type='checkbox' data-repository='${escapeHtml(project.value)}' ${selectedRepositories.has(project.value) ? 'checked' : ''}><span>${escapeHtml(project.name)}</span></label>`;
      }).join('');
      updateProjectFilterLabel(projects.map(project => project.value));
    }

    function applyProjectFilter(resetPage = true) {
      if (resetPage) currentPage = 1;
      const {projectByRepo} = getIssueProjects();
      items = allItems.filter(item => {
        if (item.kind === 'issue') {
          const hidden = (item.labels || []).some(label => (typeof label === 'string' ? label : label.name) === 'dashboard-hidden');
          if (hidden) return false;
        } else {
          const projectValues = projectByRepo.get(item.repo_full_name || repository) || new Set();
          return [...projectValues].some(value => selectedRepositories.has(value));
        }
        return selectedRepositories.has(item.project_full_name || item.repo_full_name || repository);
      });
    }

    function render() {
      const issues = [...items].filter(item => item.kind === 'issue').sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0));
      const openIssues = issues.filter(issue => issue.state !== 'closed');
      const selectableKeys = new Set(openIssues.map(issueKey));
      for (const key of selectedIssueKeys) if (!selectableKeys.has(key)) selectedIssueKeys.delete(key);
      const closedIssues = issues.filter(issue => issue.state === 'closed');
      const donePercent = issues.length ? Math.round(closedIssues.length / issues.length * 100) : 0;
      document.getElementById('progress-percent').textContent = `${donePercent}%`;
      document.getElementById('progress-done').textContent = closedIssues.length;
      document.getElementById('progress-total').textContent = issues.length;
      document.getElementById('open-count').textContent = openIssues.length;
      document.getElementById('closed-count').textContent = closedIssues.length;
      document.getElementById('progress-bar').style.width = `${donePercent}%`;
      document.querySelector('.bar').setAttribute('aria-valuenow', String(donePercent));

      const recent = [...items].sort((a, b) => Date.parse(b.updated_at || 0) - Date.parse(a.updated_at || 0)).slice(0, 5);
      recentList.innerHTML = recent.length ? recent.map(item => {
        const commit = item.kind === 'commit';
        const activityType = commit ? `提交 · ${item.repo_full_name}` : `${item.state === 'closed' ? '已完成' : '进行中'} · ${item.project_full_name}`;
        return `<div class="recent-item"><span class="dot ${!commit && item.state === 'closed' ? 'closed' : ''}"></span><div><a class="recent-title" href="${escapeHtml(item.html_url || issueUrl(item))}" target="_blank" rel="noreferrer">${escapeHtml(item.title || (commit ? '无提交说明' : '未命名需求'))}</a><div class="recent-meta">${escapeHtml(activityType)} · ${formatDate(item.updated_at)}</div></div></div>`;
      }).join('') : `<div class='empty'>${selectedRepositories.size ? '还没有进展，可以在需求页新增需求。' : '请至少选择一个项目。'}</div>`;

      const visible = filter === 'all' ? issues : issues.filter(issue => issue.state === filter);
      const totalPages = Math.max(1, Math.ceil(visible.length / pageSize));
      currentPage = Math.max(1, Math.min(currentPage, totalPages));
      const page = visible.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      issueList.innerHTML = `<table class="requirements-table" aria-label="需求列表"><thead><tr><th scope="col"><label class="issue-selection"><input id="select-page-issues" type="checkbox" aria-label="全选本页进行中的需求"><span>编号</span></label></th><th scope="col">需求</th><th scope="col">所属项目</th><th scope="col">提出人</th><th scope="col">时间</th><th scope="col">操作</th></tr></thead><tbody>${page.map(renderIssue).join('')}</tbody></table>${visible.length ? '' : `<div class="empty">${selectedRepositories.size ? filter === 'closed' ? '还没有已完成的需求。' : filter === 'all' ? '还没有需求。' : '没有进行中的需求。' : '请至少选择一个项目。'}</div>`}`;
      const pageChoices = page.filter(issue => issue.state !== 'closed');
      const selectedOnPage = pageChoices.filter(issue => selectedIssueKeys.has(issueKey(issue))).length;
      const selectPage = document.getElementById('select-page-issues');
      selectPage.checked = pageChoices.length > 0 && selectedOnPage === pageChoices.length;
      selectPage.indeterminate = selectedOnPage > 0 && selectedOnPage < pageChoices.length;
      selectPage.disabled = !pageChoices.length || (selectedIssueKeys.size >= 10 && selectedOnPage === 0);
      document.getElementById('batch-actions').hidden = !selectedIssueKeys.size;
      document.getElementById('batch-count').textContent = `已选 ${selectedIssueKeys.size} 项`;
      document.getElementById('page-info').textContent = `第 ${currentPage} / ${totalPages} 页 · 共 ${visible.length} 条`;
      document.getElementById('previous-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage === totalPages;
    }

    async function loadData() {
      const refresh = document.getElementById('refresh');
      const status = document.getElementById('sync-label');
      const error = document.getElementById('load-error');
      refresh.disabled = true;
      status.textContent = '正在刷新…';
      error.hidden = true;
      try {
        const response = await fetch(`./data.json?refresh=${Date.now()}`, {cache:'no-store'});
        if (!response.ok) throw new Error('项目数据暂时无法读取');
        const data = await response.json();
        const previouslySelected = new Set(selectedRepositories);
        repositories = data.repositories || [];
        const projectNames = new Set(repositories.map(project => project.full_name));
        allItems = (data.items || []).filter(item => (item.kind === 'issue' || item.kind === 'commit') && projectNames.has(item.repo_full_name)).map(item => item.kind === 'issue' ? normalizeIssue(item) : item);
        const {projects} = getIssueProjects();
        const projectValues = projects.map(project => project.value);
        selectedRepositories = selectedRepositories.size
          ? new Set(projectValues.filter(name => previouslySelected.has(name)))
          : new Set(projectValues);
        renderProjectFilter();
        applyProjectFilter();
        const syncedAt = data.generated_at ? new Date(data.generated_at).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
        status.textContent = syncedAt ? `数据更新于 ${syncedAt}` : '数据已更新';
        render();
      } catch (failure) {
        status.textContent = '暂时无法刷新';
        error.hidden = false;
        error.textContent = `${failure.message}；可以直接打开 GitHub 查看或提交需求。`;
        recentList.innerHTML = '<div class="empty">项目进度暂时不可用。</div>';
        issueList.innerHTML = '<div class="empty">需求暂时不可用。</div>';
      } finally {
        refresh.disabled = false;
      }
    }

    async function refreshIssuesFromGitHub() {
      try {
        const data = [];
        let page = 1;
        while (true) {
          const response = await fetch(`https://api.github.com/repos/${repository}/issues?state=all&per_page=100&page=${page}`, {headers:{Accept:'application/vnd.github+json'}, cache:'no-store'});
          if (!response.ok) throw new Error('GitHub 暂时无法读取');
          const batch = await response.json();
          data.push(...batch);
          if (batch.length < 100) break;
          page += 1;
        }
        allItems = [...allItems.filter(item => item.repo_full_name !== repository || item.kind === 'commit'), ...data.filter(issue => !issue.pull_request).map(issue => normalizeIssue({...issue, kind:'issue', repo_full_name:repository}))];
        applyProjectFilter();
        document.getElementById('sync-label').textContent = '需求列表已更新';
        render();
      } catch {
        document.getElementById('sync-label').textContent = '需求已提交，GitHub 列表暂时无法刷新';
      }
    }

    document.querySelectorAll('[data-view-target]').forEach(button => button.addEventListener('click', () => {
      const view = button.dataset.viewTarget;
      document.querySelectorAll('[data-view-target]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelectorAll('[data-view-panel]').forEach(panel => panel.hidden = panel.dataset.viewPanel !== view);
    }));

    document.getElementById('open-requirement-dialog').addEventListener('click', () => {
      document.getElementById('form-note').textContent = '';
      const project = document.getElementById('issue-project');
      project.innerHTML = repositories.map(item => `<option value="${escapeHtml(item.full_name)}">${escapeHtml(item.name)}</option>`).join('');
      project.value = repositories.find(item => selectedRepositories.has(item.full_name))?.full_name || repositories[0]?.full_name || '';
      requirementsDialog.showModal();
    });

    document.getElementById('close-requirement-dialog').addEventListener('click', () => requirementsDialog.close());
    issueList.addEventListener('click', event => {
      const button = event.target.closest('[data-edit-submitter]');
      if (!button) return;
      const issue = allItems.find(item => item.kind === 'issue' && issueKey(item) === button.dataset.editSubmitter);
      if (issue) submitterEditor.open(issue);
    });
    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      selectedIssueKeys.clear();
      currentPage = 1;
      document.querySelectorAll('[data-filter]').forEach(item => item.classList.toggle('active', item === button));
      render();
    }));

    document.getElementById('refresh').addEventListener('click', loadData);
    document.getElementById('previous-page').addEventListener('click', () => { currentPage -= 1; render(); });
    document.getElementById('next-page').addEventListener('click', () => { currentPage += 1; render(); });

    const completeDialog = document.getElementById('complete-dialog');
    const notifySubmitter = document.getElementById('notify-submitter');
    const completionSummary = document.getElementById('completion-summary');
    const batchFields = document.getElementById('batch-completion-fields');
    let draftStorage;
    try { draftStorage = localStorage; } catch {}
    const completionDrafts = createCompletionDraftStore({ apiBaseUrl: issueApiBaseUrl, storage: draftStorage,
      onChange(key, state) {
        if (!completeDialog.open || !completionTargets.some(issue => issueKey(issue) === key)) return;
        const input = batchCompletion ? [...batchFields.querySelectorAll('[data-batch-summary]')]
          .find(element => element.dataset.batchSummary === key) : completionSummary;
        if (!state.dirty && input && input.value !== state.summary) input.value = state.summary;
        const status = batchCompletion ? [...batchFields.querySelectorAll('[data-draft-status]')]
          .find(element => element.dataset.draftStatus === key) : document.getElementById('completion-draft-status');
        if (!status) return;
        const messages = { loading: '正在读取已保存的说明…', saving: '正在保存草稿…', saved: '草稿已保存',
          local: state.localSaved ? '已保存在本机，等待同步…' : '等待保存草稿…',
          error: state.localSaved ? '草稿已保存在本机，云端暂未保存。' : '草稿尚未保存，请保持页面打开后重试。',
          conflict: '另一处已更新说明，当前修改已保留。' };
        status.textContent = messages[state.status] || '';
        if (['error', 'conflict'].includes(state.status)) {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.dataset.retryDraft = key;
          retry.textContent = state.status === 'conflict' ? '保存当前说明' : '重试保存';
          status.append(' ', retry);
        }
      },
    });
    function refreshCompletionDrafts() {
      if (!completeDialog.open || completionBusy || document.hidden) return;
      completionTargets.forEach(issue => {
        const key = issueKey(issue);
        if (!completionDrafts.state(key).dirty) completionDrafts.load(key);
      });
    }
    function openCompletionDialog(requirements, batch) {
      if (!requirements.length) return;
      completionTargets = requirements;
      batchCompletion = batch;
      completionPendingKeys = new Set(requirements.map(issueKey));
      completionResults.clear();
      submittedNotificationCount = 0;
      document.getElementById('complete-dialog-title').textContent = batch ? '批量完成需求' : '完成需求';
      document.getElementById('complete-issue-title').textContent = batch ? `本次完成 ${requirements.length} 项需求` : requirements[0].title;
      document.getElementById('completion-description').textContent = batch ? '确认后移入“已完成”。同一提出人的需求合并为一条通知，不同的人各收自己的内容。' : '确认后标记为已完成，自动移入“已完成”列表；需求和附件都会保留。';
      document.getElementById('single-completion-field').hidden = batch;
      batchFields.hidden = !batch;
      const draftValue = issue => completionDrafts.value(issueKey(issue), issue.completion_draft ?? issue.completion_summary ?? '');
      completionSummary.value = batch ? '' : draftValue(requirements[0]);
      document.getElementById('completion-draft-status').textContent = '';
      batchFields.innerHTML = batch ? requirements.map(issue => `<section class="completion-entry"><strong class="completion-entry-title">${escapeHtml(issue.title)}</strong><p class="completion-entry-meta">提出人：${escapeHtml(issue.submitter || '未填写')}</p><label class="field"><span>改好了什么（选填）</span><textarea data-batch-summary="${escapeHtml(issueKey(issue))}" maxlength="500" placeholder="用一两句话说明做了什么、现在能怎么用。">${escapeHtml(draftValue(issue))}</textarea></label><p class="draft-save-status" data-draft-status="${escapeHtml(issueKey(issue))}" role="status"></p><p class="batch-entry-result" data-batch-result="${escapeHtml(issueKey(issue))}" role="status"></p></section>`).join('') : '';
      document.getElementById('notify-submitter-label').textContent = batch ? '通过钉钉通知提出人（同一个人合并，每人一条）' : `通过钉钉通知提出人：${requirements[0].submitter || requirements[0].actor || '未填写'}`;
      document.getElementById('complete-note').textContent = '';
      document.getElementById('confirm-complete').textContent = batch ? '确认完成并合并通知' : '确认完成';
      completeDialog.showModal();
      requirements.forEach(issue => {
        const key = issueKey(issue);
        completionDrafts.load(key).then(() => {
          if (completionDrafts.state(key).dirty && completionDrafts.state(key).status === 'local') completionDrafts.flush([key]);
        });
      });
    }
    completeDialog.addEventListener('input', event => {
      if (completionBusy) return;
      const input = event.target;
      const key = input.id === 'completion-summary' ? completionTargets[0] && issueKey(completionTargets[0]) : input.dataset.batchSummary;
      if (key) completionDrafts.update(key, input.value);
    });
    completeDialog.addEventListener('focusout', event => {
      const key = event.target.id === 'completion-summary' ? completionTargets[0] && issueKey(completionTargets[0]) : event.target.dataset.batchSummary;
      if (key) completionDrafts.flush([key]);
    });
    completeDialog.addEventListener('click', event => {
      const retry = event.target.closest('[data-retry-draft]');
      if (retry && !completionBusy) completionDrafts.retry(retry.dataset.retryDraft);
    });
    window.addEventListener('pagehide', () => completionDrafts.flush());
    window.addEventListener('focus', refreshCompletionDrafts);
    document.addEventListener('visibilitychange', refreshCompletionDrafts);
    setInterval(refreshCompletionDrafts, 20000);
    issueList.addEventListener('change', event => {
      const input = event.target.closest('input[type="checkbox"]');
      if (!input) return;
      document.getElementById('selection-note').textContent = '可跨页选择，每批最多 10 项';
      if (input.id === 'select-page-issues') {
        const keys = [...issueList.querySelectorAll('input[data-select-issue]')].map(choice => choice.dataset.selectIssue);
        if (input.checked && new Set([...selectedIssueKeys, ...keys]).size > 10) {
          document.getElementById('selection-note').textContent = '每批最多 10 项，可先清空选择或逐项勾选。';
        } else {
          for (const key of keys) if (input.checked) selectedIssueKeys.add(key); else selectedIssueKeys.delete(key);
        }
      } else if (input.dataset.selectIssue) {
        if (input.checked && selectedIssueKeys.size < 10) selectedIssueKeys.add(input.dataset.selectIssue);
        else selectedIssueKeys.delete(input.dataset.selectIssue);
      }
      render();
    });
    document.getElementById('clear-selected-issues').addEventListener('click', () => { selectedIssueKeys.clear(); render(); });
    notifySubmitter.addEventListener('change', () => {
      if (batchCompletion && completionResults.size === 0) document.getElementById('confirm-complete').textContent = notifySubmitter.checked ? '确认完成并合并通知' : '确认完成';
    });
    document.getElementById('open-batch-completion').addEventListener('click', () => {
      const requirements = [...selectedIssueKeys].map(key => items.find(item => item.kind === 'issue' && item.state !== 'closed' && issueKey(item) === key)).filter(Boolean);
      openCompletionDialog(requirements, true);
    });
    issueList.addEventListener('click', event => {
      const button = event.target.closest('button[data-complete-issue]');
      if (!button) return;
      const issue = items.find(item => item.kind === 'issue' && item.state !== 'closed' && issueKey(item) === button.dataset.completeIssue);
      if (issue) openCompletionDialog([issue], false);
    });
    document.getElementById('close-complete-dialog').addEventListener('click', () => { if (!completionBusy) completeDialog.close(); });
    completeDialog.addEventListener('cancel', event => { if (completionBusy) event.preventDefault(); });
    completeDialog.addEventListener('close', () => { completionDrafts.flush(completionTargets.map(issueKey)); notifySubmitter.checked = true; completionSummary.value = ''; batchFields.innerHTML = ''; completionTargets = []; completionPendingKeys.clear(); completionResults.clear(); document.getElementById('confirm-complete').textContent = '确认完成'; });
    document.getElementById('complete-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (completionBusy || !completionTargets.length) return;
      const note = document.getElementById('complete-note');
      if (issueApiBaseUrl.includes('ACCOUNT_SUBDOMAIN')) {
        note.textContent = '需求完成通道还未部署，请稍后再试。';
        return;
      }
      const requirements = completionTargets.filter(issue => completionPendingKeys.has(issueKey(issue)));
      if (!requirements.length) return;
      const summaries = new Map([...batchFields.querySelectorAll('textarea[data-batch-summary]')].map(input => [input.dataset.batchSummary, input.value.trim()]));
      const shouldNotify = notifySubmitter.checked;
      const button = document.getElementById('confirm-complete');
      completionBusy = true;
      button.disabled = true;
      document.getElementById('close-complete-dialog').disabled = true;
      notifySubmitter.disabled = true;
      completionSummary.disabled = true;
      batchFields.querySelectorAll('textarea').forEach(input => input.disabled = true);
      note.textContent = batchCompletion ? '正在完成需求并合并通知…' : '正在标记完成…';
      try {
        await completionDrafts.flush(requirements.map(issueKey));
        const issue = requirements[0];
        const route = batchCompletion ? '/api/issues/complete-batch' : `/api/issues/${(issue.repo_full_name || repository).split('/').map(encodeURIComponent).join('/')}/${encodeURIComponent(issueNumber(issue))}`;
        const payload = batchCompletion ? { issues: requirements.map(item => ({ repo: item.repo_full_name || repository, number: Number(issueNumber(item)), completion_summary: summaries.get(issueKey(item)) || '' })), notify_submitter: shouldNotify } : { notify_submitter: shouldNotify, completion_summary: completionSummary.value.trim() };
        const response = await fetch(new URL(route, issueApiBaseUrl), {method:batchCompletion ? 'POST' : 'PATCH', headers: {'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '完成失败，请稍后重试。');
        const results = batchCompletion ? result.results : [{ ...result, repo: issue.repo_full_name || repository, number: Number(issueNumber(issue)) }];
        const submittedKeys = new Set(requirements.map(issueKey));
        if (!Array.isArray(results) || results.length !== requirements.length || new Set(results.map(entry => entry.repo + '#' + entry.number)).size !== results.length || results.some(entry => !submittedKeys.has(entry.repo + '#' + entry.number))) throw new Error('完成结果不完整，请刷新核对需求状态后再操作。');
        submittedNotificationCount += batchCompletion ? result.notification_count || 0 : result.notification === 'queued' ? 1 : 0;
        for (const entry of results) {
          const key = entry.repo + '#' + entry.number;
          const completed = entry.state === 'closed' && Number.isFinite(Date.parse(entry.updated_at));
          completionResults.set(key, entry);
          if (completed) {
            completionDrafts.forget(key);
            pendingCompletions.set(key, entry.updated_at);
            selectedIssueKeys.delete(key);
            const savedSummary = batchCompletion ? summaries.get(key) || '' : completionSummary.value.trim();
            allItems = allItems.map(item => item.kind === 'issue' && issueKey(item) === key ? {...item, state:'closed', updated_at:entry.updated_at, completion_summary:savedSummary || item.completion_summary} : item);
          }
          const success = completed && (!shouldNotify || entry.notification === 'queued');
          if (success) completionPendingKeys.delete(key);
          const resultLabel = [...batchFields.querySelectorAll('[data-batch-result]')].find(label => label.dataset.batchResult === key);
          if (resultLabel) resultLabel.textContent = !completed ? `未成功：${entry.error || '请核对需求状态。'}` : entry.notification === 'failed' ? `已完成，通知未成功：${entry.notification_error || '请稍后重试。'}` : shouldNotify ? '已完成，通知已提交。' : '已完成，未发送通知。';
        }
        saveCompletions();
        applyProjectFilter(false);
        render();
        const completedCount = [...completionResults.values()].filter(entry => entry.state === 'closed').length;
        if (completionPendingKeys.size) {
          const failure = [...completionResults.values()].find(entry => entry.error || entry.notification_error);
          note.textContent = `${completedCount} 项已完成，${completionPendingKeys.size} 项未成功：${failure?.error || failure?.notification_error || '请核对状态后重试。'}`;
          button.textContent = batchCompletion ? '重试未成功项' : '重试钉钉通知';
          document.getElementById('sync-label').textContent = '完成结果中有未成功项，请查看弹窗';
        } else {
          const warning = [...completionResults.values()].find(entry => entry.notification_warning)?.notification_warning;
          const status = warning || (batchCompletion ? `${completedCount} 项需求已完成${submittedNotificationCount ? `，已合并提交 ${submittedNotificationCount} 条钉钉通知` : ''}` : result.notification === 'queued' ? (result.notification_format === 'card' ? '需求已完成，钉钉卡片已提交' : '需求已完成，钉钉通知已提交') : '需求已完成，可在“已完成”列表查看');
          completeDialog.close();
          document.getElementById('sync-label').textContent = status;
        }
      } catch (error) {
        note.textContent = error instanceof TypeError || error instanceof SyntaxError ? '本次结果未确认，请先核对需求状态和钉钉消息，再重试，避免重复通知。' : error.message || '完成失败，请稍后重试。';
      } finally {
        completionBusy = false;
        button.disabled = false;
        document.getElementById('close-complete-dialog').disabled = false;
        notifySubmitter.disabled = false;
        completionSummary.disabled = false;
        batchFields.querySelectorAll('textarea[data-batch-summary]').forEach(input => input.disabled = !completionPendingKeys.has(input.dataset.batchSummary));
      }
    });

    projectSearch.addEventListener('input', renderProjectFilter);
    projectOptions.addEventListener('change', event => {
      const input = event.target.closest('input[data-repository]');
      if (!input) return;
      if (input.checked) selectedRepositories.add(input.dataset.repository);
      else selectedRepositories.delete(input.dataset.repository);
      updateProjectFilterLabel([...selectedRepositories]);
      applyProjectFilter();
      render();
    });
    document.getElementById('select-all-projects').addEventListener('click', () => {
      selectedRepositories = new Set(projectOptions.querySelectorAll('input[data-repository]').map(input => input.dataset.repository));
      projectOptions.querySelectorAll('input[data-repository]').forEach(input => input.checked = true);
      updateProjectFilterLabel();
      applyProjectFilter();
      render();
    });
    document.getElementById('clear-projects').addEventListener('click', () => {
      selectedRepositories.clear();
      projectOptions.querySelectorAll('input[data-repository]').forEach(input => input.checked = false);
      updateProjectFilterLabel();
      applyProjectFilter();
      render();
    });

    document.getElementById('issue-body').addEventListener('paste', event => {
      const images = Array.from(event.clipboardData?.items || []).filter(item => item.type.startsWith('image/')).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      event.preventDefault();
      if (attachmentFiles.length + images.length > 4) {
        document.getElementById('form-note').textContent = '最多粘贴 4 张图片。';
        return;
      }
      images.forEach(file => attachmentFiles.push({file, url:URL.createObjectURL(file)}));
      document.getElementById('attachments').innerHTML = attachmentFiles.map((attachment, index) => `<div class="attachment"><img src="${attachment.url}" alt="粘贴的截图 ${index + 1}"></div>`).join('');
      document.getElementById('form-note').textContent = `已添加 ${attachmentFiles.length} 张图片。`;
    });

    document.getElementById('requirement-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const title = document.getElementById('issue-title').value.trim();
      const description = document.getElementById('issue-body').value.trim();
      const project = document.getElementById('issue-project').value;
      const submitter = document.getElementById('issue-submitter').value.trim();
      if (!title) {
        document.getElementById('form-note').textContent = '先写一个需求标题。';
        return;
      }
      const formNote = document.getElementById('form-note');
      if (!project || !submitter) {
        formNote.textContent = '请选择所属项目，并填写提出人姓名。';
        return;
      }
      const submitButton = form.querySelector('[type="submit"]');
      if (issueApiBaseUrl.includes('ACCOUNT_SUBDOMAIN')) {
        formNote.textContent = '自动提交通道还未部署，请稍后再试。';
        return;
      }
      const payload = new FormData();
      payload.set('title', title);
      payload.set('body', description);
      payload.set('project', project);
      payload.set('submitter', submitter);
      payload.set('company_website', form.elements.company_website.value);
      attachmentFiles.forEach(({file}) => payload.append('image', file, file.name));
      submitButton.disabled = true;
      formNote.textContent = '正在提交…';
      try {
        const response = await fetch(new URL('/api/issues', issueApiBaseUrl), {method:'POST', body:payload});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '提交失败，请稍后重试。');
        allItems.unshift(normalizeIssue({kind:'issue', repo_full_name:repository, number:result.number, title, project_full_name:project, submitter, state:'open', created_at:result.created_at, updated_at:result.updated_at, html_url:result.url, labels:[]}));
        selectedRepositories.add(project);
        filter = 'open';
        document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
        renderProjectFilter();
        applyProjectFilter();
        render();
        requirementsDialog.close();
        form.reset();
        attachmentFiles.splice(0).forEach(({url}) => URL.revokeObjectURL(url));
        document.getElementById('attachments').replaceChildren();
        document.getElementById('sync-label').textContent = `需求 #${result.number} 已提交`;
        await refreshIssuesFromGitHub();
      } catch (error) {
        formNote.textContent = error.message || '提交失败，请稍后重试。';
      } finally {
        submitButton.disabled = false;
      }
    });

    loadData();
  </script>
</body>
</html>
