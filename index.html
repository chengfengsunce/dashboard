<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub &#28304;&#30721;&#30475;&#26495;</title>
  <style>
    :root{--bg:#20242b;--panel:#282d35;--hover:#303640;--line:#3a414c;--text:#d7dae0;--muted:#8b93a1;--blue:#61afef;--green:#98c379;--yellow:#e5c07b;--red:#e06c75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}a{color:inherit}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 4vw;border-bottom:1px solid var(--line)}h1{margin:0;color:#fff;font-size:24px}.subtitle{color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button,select{border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);padding:7px 11px;font:inherit;cursor:pointer}.button:hover,select:hover{background:var(--hover);color:#fff}.button.primary{background:var(--green);border-color:var(--green);color:#20242b;font-weight:bold}.layout{display:grid;grid-template-columns:240px minmax(250px,390px) minmax(0,1fr);min-height:calc(100vh - 94px)}.panel{border-right:1px solid var(--line);min-width:0}.panel:last-child{border-right:0}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--line);font-weight:bold}.repo-list,.tree{list-style:none;padding:8px;margin:0}.repo-list li button,.tree button{display:block;width:100%;border:0;border-radius:4px;background:transparent;color:var(--text);padding:8px 10px;text-align:left;font:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo-list li button:hover,.tree button:hover,.repo-list li.active button,.tree button.active{background:var(--hover);color:#fff}.repo-name{font-weight:bold}.repo-meta{display:block;color:var(--muted);font-size:11px;margin-top:2px}.tree-wrap{height:calc(100vh - 151px);overflow:auto}.tree li{margin:1px 0}.tree button{font:13px Consolas,monospace}.tree .folder{color:var(--yellow)}.tree .file{color:var(--blue)}.source-wrap{height:calc(100vh - 151px);overflow:auto}.source-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.source-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px Consolas,monospace}.source{margin:0;padding:18px 20px;min-height:100%;white-space:pre;overflow:auto;font:13px/1.6 Consolas,monospace;color:#d7dae0}.empty,.error,.loading{padding:40px 20px;color:var(--muted);text-align:center}.error{color:var(--red)}.tabs{display:flex;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}.tab.active{background:var(--hover);color:#fff}.activity{display:none;padding:12px 15px;height:calc(100vh - 151px);overflow:auto}.activity.show{display:block}.activity-item{padding:10px 0;border-bottom:1px solid var(--line)}.activity-item a{color:var(--blue);text-decoration:none}.activity-meta{color:var(--muted);font-size:12px;margin-top:3px}@media(max-width:900px){.layout{grid-template-columns:190px 260px minmax(0,1fr)}}@media(max-width:680px){.header{display:block}.actions{margin-top:12px}.layout{display:block}.panel{border-right:0;border-bottom:1px solid var(--line)}.repo-list{display:flex;gap:6px;overflow:auto}.repo-list li{min-width:145px}.tree-wrap,.source-wrap{height:auto;max-height:55vh}.source-wrap{min-height:300px}.source{min-height:300px}}
  </style>
</head>
<body>
  <header class="header"><div><h1>GitHub &#28304;&#30721;&#30475;&#26495;</h1><div class="subtitle" id="subtitle">&#27491;&#22312;&#21152;&#36733;&#20179;&#24211;&#19982;&#28304;&#30721;...</div></div><div class="actions"><button class="button" id="refresh">&#21047;&#26032;</button><a class="button primary" id="github-link" target="_blank" rel="noreferrer">&#25171;&#24320; GitHub</a></div></header>
  <main class="layout"><section class="panel"><div class="panel-head">&#20179;&#24211;</div><ul class="repo-list" id="repos"></ul></section><section class="panel"><div class="panel-head"><span>&#28304;&#30721;&#30446;&#24405;</span><select id="branch" aria-label="&#20998;&#25903;"></select></div><div class="tabs"><button class="tab active" data-tab="source">&#28304;&#30721;</button><button class="tab" data-tab="activity">&#26368;&#36817;&#36827;&#24230;</button></div><div id="tree-wrap" class="tree-wrap"><div id="tree-message" class="empty">&#35831;&#36873;&#25321;&#20179;&#24211;</div><ul id="tree" class="tree"></ul></div><div id="activity" class="activity"></div></section><section class="panel"><div class="source-wrap"><div class="source-head"><span id="source-path" class="source-path">&#36873;&#25321;&#25991;&#20214;&#26597;&#30475;&#28304;&#30721;</span><a id="raw-link" target="_blank" rel="noreferrer">Raw</a></div><pre id="source" class="source">&#35831;&#20174;&#20013;&#38388;&#30340;&#28304;&#30721;&#30446;&#24405;&#20013;&#36873;&#25321;&#25991;&#20214;</pre></div></section></main>
  <script>
    let data={repositories:[],items:[]},selectedRepo=null,selectedBranch=null;const $=id=>document.getElementById(id);
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function fmt(v){if(!v)return'Unknown';const d=new Date(v);return Number.isNaN(d.getTime())?'Unknown':d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
    function repoItems(){return data.items.filter(x=>x.repo_full_name===selectedRepo.full_name);}
    function renderRepos(){ $('repos').innerHTML=data.repositories.map((r,i)=>`<li class="${i===0?'active':''}"><button data-repo="${esc(r.full_name)}"><span class="repo-name">${esc(r.name)}</span><span class="repo-meta">${r.private?'Private':'Public'} · ${esc(r.language||'Unknown')}</span></button></li>`).join('');document.querySelectorAll('[data-repo]').forEach(b=>b.addEventListener('click',()=>selectRepo(b.dataset.repo)));}
    function selectRepo(fullName){selectedRepo=data.repositories.find(r=>r.full_name===fullName)||data.repositories[0];document.querySelectorAll('[data-repo]').forEach(b=>b.parentElement.classList.toggle('active',b.dataset.repo===selectedRepo.full_name));$('github-link').href=selectedRepo.html_url;$('subtitle').textContent=`${selectedRepo.full_name} · ${selectedRepo.private?'Private repository; source is not published':'Public source browser'}`;const source=selectedRepo.source||{};$('branch').innerHTML=(source.branches||[]).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');selectedBranch=source.branches?.find(b=>b.name===selectedRepo.default_branch)||source.branches?.[0];$('branch').value=selectedBranch?.name||'';renderTree();renderActivity();clearSource();}
    function renderTree(){const tree=selectedBranch?.entries||[];if(!selectedRepo?.source?.available){$('tree-message').textContent='私有仓库源码不在公开看板展示，请打开 GitHub 查看';$('tree').innerHTML='';return}if(!tree.length){$('tree-message').textContent='该分支暂无可展示文件';$('tree').innerHTML='';return}$('tree-message').textContent=selectedBranch.truncated?'文件较多，仅展示部分目录':'选择文件查看源码';const sorted=[...tree].sort((a,b)=>a.path.localeCompare(b.path));$('tree').innerHTML=sorted.map(f=>`<li><button class="file" data-file="${esc(f.path)}" title="${esc(f.path)}">&#128196; ${esc(f.path)}</button></li>`).join('');document.querySelectorAll('[data-file]').forEach(b=>b.addEventListener('click',()=>loadFile(b.dataset.file)));}
    async function loadFile(path){document.querySelectorAll('[data-file]').forEach(b=>b.classList.toggle('active',b.dataset.file===path));$('source-path').textContent=path;$('source').textContent='Loading...';const raw=`https://raw.githubusercontent.com/${selectedRepo.full_name}/${encodeURIComponent(selectedBranch.name).replace(/%2F/g,'/')}/${path.split('/').map(encodeURIComponent).join('/')}`;$('raw-link').href=raw;try{const res=await fetch(raw);if(!res.ok)throw new Error(`HTTP ${res.status}`);const text=await res.text();if(text.length>1000000)throw new Error('File is larger than 1 MB');$('source').textContent=text;}catch(e){$('source').textContent=`Unable to load source: ${e.message}`;}}
    function renderActivity(){const items=repoItems().slice(0,40);$('activity').innerHTML=items.length?items.map(x=>`<div class="activity-item"><a href="${esc(x.html_url)}" target="_blank" rel="noreferrer">${esc(x.title)}</a><div class="activity-meta">${esc(x.kind)} · ${fmt(x.updated_at)}</div></div>`).join(''):'<div class="empty">暂无动态</div>';}
    function clearSource(){$('source-path').textContent='选择文件查看源码';$('source').textContent=selectedRepo?.private?'私有仓库源码不公开展示，请点击右上角打开 GitHub':'请从中间的源码目录中选择文件';$('raw-link').removeAttribute('href');}
    async function load(force=false){$('subtitle').textContent='Loading repositories and source trees...';try{const r=await fetch(`data.json${force?`?t=${Date.now()}`:''}`,{cache:force?'no-store':'default'});if(!r.ok)throw new Error(`HTTP ${r.status}`);data=await r.json();renderRepos();if(data.repositories.length)selectRepo(data.repositories[0].full_name);$('refresh').textContent='Refresh';}catch(e){$('subtitle').textContent=`Unable to load dashboard data: ${e.message}`;}}
    $('branch').addEventListener('change',()=>{selectedBranch=selectedRepo.source.branches.find(b=>b.name===$('branch').value);renderTree();clearSource();});$('refresh').addEventListener('click',()=>load(true));document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');const source=t.dataset.tab==='source';$('tree-wrap').style.display=source?'block':'none';$('activity').classList.toggle('show',!source);}));load();
  </script>
</body>
</html>
