<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="chengfengsunce GitHub project activity dashboard">
  <title>GitHub &#39033;&#30446;&#21160;&#24577;&#30475;&#26495;</title>
  <style>
    :root { --bg:#20242b; --panel:#282d35; --hover:#303640; --line:#3a414c; --text:#d7dae0; --muted:#8b93a1; --blue:#61afef; --green:#98c379; --yellow:#e5c07b; --purple:#c678dd; --red:#e06c75; }
    * { box-sizing:border-box; } body { margin:0; padding:28px 5vw 48px; background:var(--bg); color:var(--text); font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif; }
    a { color:inherit; } .header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; max-width:1180px; margin:0 auto 26px; }
    h1 { margin:0 0 5px; color:#fff; font-size:clamp(21px,3vw,28px); } .subtitle,.updated { color:var(--muted); } .header-actions { display:flex; gap:9px; flex-wrap:wrap; justify-content:flex-end; }
    .button,select { border:1px solid var(--line); border-radius:5px; background:var(--panel); color:var(--text); padding:7px 12px; font:inherit; text-decoration:none; cursor:pointer; } .button:hover,select:hover { background:var(--hover); color:#fff; } .button.primary { border-color:var(--green); background:var(--green); color:#20242b; font-weight:700; }
    main { max-width:1180px; margin:auto; } .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:22px; } .stat { border:1px solid var(--line); border-radius:7px; background:var(--panel); padding:13px 15px; } .stat strong { display:block; color:#fff; font-size:21px; } .stat span { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px; } .toolbar-left { display:flex; gap:8px; flex-wrap:wrap; }
    .feed { list-style:none; padding:5px 0 20px 21px; margin:0; border-left:2px solid var(--line); } .item { position:relative; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:13px 15px; margin-bottom:2px; border-radius:6px; } .item::before { content:""; position:absolute; left:-28px; top:50%; width:9px; height:9px; transform:translateY(-50%); border:3px solid var(--bg); border-radius:50%; background:var(--color,var(--muted)); } .item:hover { background:var(--hover); }
    .item-main { min-width:0; display:flex; align-items:center; gap:10px; } .badge { flex:0 0 auto; max-width:180px; overflow:hidden; padding:2px 7px; border-radius:4px; background:var(--color,var(--muted)); color:#20242b; font:700 11px Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; } .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); text-decoration:none; } .title:hover { color:var(--blue); } .meta { flex:0 0 auto; display:flex; gap:12px; color:var(--muted); font:12px Consolas,monospace; } .empty,.loading,.error { padding:45px 20px; color:var(--muted); text-align:center; } .error { color:var(--red); }
    @media (max-width:700px) { body { padding:22px 16px 35px; } .header { display:block; } .header-actions { justify-content:flex-start; margin-top:14px; } .stats { grid-template-columns:repeat(2,1fr); } .stat:last-child { grid-column:span 2; } .toolbar { display:block; } .toolbar-left { margin-bottom:10px; } select { width:100%; } .item { display:block; } .meta { margin-top:7px; } .badge { max-width:140px; } }
  </style>
</head>
<body>
  <header class="header"><div><h1>GitHub &#39033;&#30446;&#21160;&#24577;&#30475;&#26495;</h1><div class="subtitle">chengfengsunce &#183; &#33258;&#21160;&#21516;&#27493;&#20844;&#24320;&#20179;&#24211;</div></div><div class="header-actions"><a class="button primary" href="https://github.com/chengfengsunce?tab=repositories" target="_blank" rel="noreferrer">&#26597;&#30475;&#20179;&#24211;</a><button class="button" id="refresh" type="button">&#21047;&#26032;&#25968;&#25454;</button></div></header>
  <main>
    <section class="stats" aria-label="&#32479;&#35745;"><div class="stat"><strong id="repositories">-</strong><span>&#20844;&#24320;&#20179;&#24211;</span></div><div class="stat"><strong id="commits">-</strong><span>&#25552;&#20132;</span></div><div class="stat"><strong id="issues">-</strong><span>Issue</span></div><div class="stat"><strong id="pull-requests">-</strong><span>Pull Request</span></div><div class="stat"><strong id="releases">-</strong><span>&#29256;&#26412;&#21457;&#24067;</span></div></section>
    <div class="toolbar"><div class="toolbar-left"><select id="kind" aria-label="&#21160;&#24577;&#31867;&#22411;"><option value="all">&#20840;&#37096;&#21160;&#24577;</option><option value="commit">&#25552;&#20132;</option><option value="issue">Issue</option><option value="pull_request">Pull Request</option><option value="release">&#29256;&#26412;&#21457;&#24067;</option></select><select id="repo" aria-label="&#20179;&#24211;"><option value="all">&#20840;&#37096;&#20179;&#24211;</option></select></div><div class="updated" id="updated">&#31561;&#24453;&#21516;&#27493;...</div></div>
    <div id="message" class="loading">&#27491;&#22312;&#21152;&#36733;&#21516;&#27493;&#25968;&#25454;...</div><ul id="feed" class="feed" hidden></ul>
  </main>
  <script>
    const colors={commit:'#61afef',issue:'#e06c75',pull_request:'#c678dd',release:'#e5c07b'},names={commit:'Commit',issue:'Issue',pull_request:'PR',release:'Release'}; let data={items:[],repositories:[],stats:{}}; const $=id=>document.getElementById(id);
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
    function formatDate(value){if(!value)return'Unknown time';const date=new Date(value);return Number.isNaN(date.getTime())?'Unknown time':date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
    function renderStats(){const stats=data.stats||{};[['repositories','repositories'],['commits','commits'],['issues','issues'],['pull-requests','pull_requests'],['releases','releases']].forEach(([id,key])=>$(id).textContent=stats[key]??'0');}
    function renderRepoOptions(){$('repo').innerHTML='<option value="all">All repositories</option>'+data.repositories.map(repo=>`<option value="${escapeHtml(repo.full_name)}">${escapeHtml(repo.name)}</option>`).join('');}
    function renderFeed(){const kind=$('kind').value,repo=$('repo').value,items=data.items.filter(item=>(kind==='all'||item.kind===kind)&&(repo==='all'||item.repo_full_name===repo));$('message').hidden=items.length>0;$('message').className=items.length?'loading':'empty';$('message').textContent=items.length?'':'No matching activity';$('feed').hidden=items.length===0;$('feed').innerHTML=items.map(item=>`<li class="item" style="--color:${colors[item.kind]||'#8b93a1'}"><div class="item-main"><span class="badge" title="${escapeHtml(item.repo_full_name)}">${escapeHtml(item.repo)}</span><a class="title" href="${escapeHtml(item.html_url)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a></div><div class="meta"><span>${names[item.kind]||'Activity'}</span><span>${formatDate(item.updated_at)}</span></div></li>`).join('');}
    async function load(force=false){$('message').hidden=false;$('message').className='loading';$('message').textContent='Loading synchronized data...';$('feed').hidden=true;try{const response=await fetch(`data.json${force?`?t=${Date.now()}`:''}`,{cache:force?'no-store':'default'});if(!response.ok)throw new Error(`HTTP ${response.status}`);data=await response.json();renderStats();renderRepoOptions();renderFeed();$('updated').textContent=data.generated_at?`Synced ${formatDate(data.generated_at)}`:'Sync time unknown';}catch(error){console.error(error);$('message').className='error';$('message').textContent='Data loading failed. Please try again later.';$('feed').hidden=true;}}
    $('kind').addEventListener('change',renderFeed);$('repo').addEventListener('change',renderFeed);$('refresh').addEventListener('click',()=>load(true));load();
  </script>
</body>
</html>
